[tox]
envlist =
    py{39,310,311,312,313,314}-dj52
    py{312,313,314}-dj60
    py{312,313,314}-djmain
    qa
    py{311,312,313,314,315}-dj61

[testenv]
extras = tests, daphne
commands =
    pytest -v {posargs}
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0rc1,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz

[testenv:qa]
skip_install=true
deps =
    black
    flake8
    isort
commands =
    flake8 channels tests
    black --check channels tests
    isort --check-only --diff channels tests

[testenv:py{311,312,313,314,315}-dj61]
setenv =
    DJANGO_SETTINGS_MODULE=tests.sample_project.config.settings
